name: afya-services
services:
  access-gateway:
    build:
      context: ..
      dockerfile: services/access-gateway/Dockerfile
    ports: ["8081:8080"]
    environment:
      TRIAGE_AGENT_URL: http://ai-triage-agent:8080
      AFYA_ENV: ${AFYA_ENV:-dev}
    depends_on: [ai-triage-agent]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      retries: 5

  ai-triage-agent:
    build:
      context: ..
      dockerfile: services/ai-triage-agent/Dockerfile
    ports: ["8082:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      retries: 5

  fhir-adapter:
    build:
      context: ..
      dockerfile: services/fhir-adapter/Dockerfile
    ports: ["8083:8080"]

  analytics-exporter:
    build:
      context: ..
      dockerfile: services/analytics-exporter/Dockerfile
    ports: ["8084:8080"]

  diaspora-matching:
    build:
      context: ..
      dockerfile: services/diaspora-matching/Dockerfile
    ports: ["8085:8080"]
