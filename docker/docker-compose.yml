name: afyaconnect
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnuhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-health}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gnuhealth} -d $${POSTGRES_DB:-health}"]
      interval: 5s
      timeout: 3s
      retries: 10

  tryton:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gnuhealth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GNUHEALTH_DB_HOST: postgres
      GNUHEALTH_DB_PORT: 5432
      GNUHEALTH_DB_USERNAME: ${POSTGRES_USER:-gnuhealth}
      GNUHEALTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME-dev-only}
      GNUHEALTH_DB_NAME: ${POSTGRES_DB:-health}
      TRYTON_ADMIN_PASSWORD: ${TRYTON_ADMIN_PASSWORD:-CHANGEME-dev-only}
    volumes:
      - trytondata:/var/lib/tryton
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;s=socket.create_connection(('127.0.0.1',8000),timeout=3);s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      tryton:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8091}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  trytondata:
