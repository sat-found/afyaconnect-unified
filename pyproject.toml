[project]
name = "afyaconnect-unified"
version = "0.5.0"
description = "AfyaConnect x GNU Health HMIS unified platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["services: live-service acceptance checks (skipped when services are down)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["gnuhealth", "services"]
omit = ["*/wizard/*", "tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
